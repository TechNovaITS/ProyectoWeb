services:
  # Miembro inicial del clúster; el rol PRIMARY sigue siendo dinámico.
  main:
    container_name: docker-mysql-main
    hostname: main
    build:
      context: ./mysql
      dockerfile: Dockerfile.node-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    volumes:
      - mysql_1_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql-1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Miembro de respaldo; Group Replication puede elegirlo como PRIMARY.
  fallback:
    container_name: docker-mysql-fallback
    hostname: fallback
    build:
      context: ./mysql
      dockerfile: Dockerfile.node-2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    volumes:
      - mysql_2_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql-2
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Tercer miembro; "slave" es el nombre solicitado, no un rol fijo de replicación.
  slave:
    container_name: docker-mysql-slave
    hostname: slave
    build:
      context: ./mysql
      dockerfile: Dockerfile.node-3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    volumes:
      - mysql_3_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql-3
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Crea el clúster una sola vez y agrega los otros dos nodos.
  inicializar-cluster:
    container_name: docker-mysql-inicializar-cluster
    build: ./mysql-shell
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD:-monitorpass}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-exporterpass}
    volumes:
      - ./mysql/inicializar-cluster.js:/scripts/inicializar-cluster.js:ro
    command: ["mysqlsh", "--js", "--file", "/scripts/inicializar-cluster.js"]
    depends_on:
      main:
        condition: service_healthy
      fallback:
        condition: service_healthy
      slave:
        condition: service_healthy

  # ProxySQL detecta el primario del clúster y enruta las conexiones SQL.
  proxy:
    container_name: docker-proxy-sql
    build: ./proxysql
    restart: unless-stopped
    environment:
      PROXYSQL_ADMIN_USER: ${PROXYSQL_ADMIN_USER:-clusteradmin}
      PROXYSQL_ADMIN_PASSWORD: ${PROXYSQL_ADMIN_PASSWORD:-adminpass}
    ports:
      - "6033:6033"
    volumes:
      - proxysql_data:/var/lib/proxysql
    depends_on:
      inicializar-cluster:
        condition: service_completed_successfully

  # Carga la configuración de monitoreo, nodos y usuario de aplicación.
  configurar-proxy:
    container_name: docker-configurar-proxy-sql
    build:
      context: ./proxysql
      dockerfile: Dockerfile.configurar
    restart: "no"
    environment:
      PROXYSQL_ADMIN_USER: ${PROXYSQL_ADMIN_USER:-clusteradmin}
      PROXYSQL_ADMIN_PASSWORD: ${PROXYSQL_ADMIN_PASSWORD:-adminpass}
      MYSQL_MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD:-monitorpass}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
    entrypoint: ["/bin/sh", "/scripts/configurar-proxy.sh"]
    depends_on:
      proxy:
        condition: service_started

  # Servicio Backend (Laravel + Apache)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./web:/var/www/html
      - apache_logs:/var/log/apache2
    depends_on:
      - proxy
    networks:
      - app_network

  # --- STACK DE MONITOREO ---

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./grafana:/var/lib/grafana
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    networks:
      - app_network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - apache_logs:/var/log/apache:ro
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    networks:
      - app_network

volumes:
  mysql_1_data:
  mysql_2_data:
  mysql_3_data:
  proxysql_data:
  db_data:
  prometheus_data:
  loki_data:
  apache_logs:

networks:
  app_network:
    driver: bridge