services:
  # Servicio de Base de Datos
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_api
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: api_user
      MYSQL_PASSWORD: apipassword
    ports:
      - "3305:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  # Servicio Backend (Laravel + Apache)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db
    networks:
      - app_network


volumes:
  db_data:

networks:
  app_network:
    driver: bridge
