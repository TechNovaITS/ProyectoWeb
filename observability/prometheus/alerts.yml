# Reglas iniciales de disponibilidad de servicios y consumo de contenedores.
groups:
  - name: infrastructure
    rules:
      - alert: ScrapeTargetUnavailable
        # Un único fallo transitorio no dispara una alerta; debe durar dos minutos.
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Objetivo de métricas no disponible: {{ $labels.job }}"
          description: "{{ $labels.instance }} no responde a las consultas de métricas."

      - alert: MySQLInstanceUnavailable
        # mysql_up prueba la consulta al servidor, además del scrape del exporter.
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL no responde en {{ $labels.instance }}"
          description: "El exporter no puede consultar la instancia MySQL."

      - alert: ContainerMemoryUsageHigh
        # Solo considera contenedores con límite configurado para evitar división inválida.
        expr: |
          (
            container_memory_working_set_bytes{image!="", name!=""}
            /
            container_spec_memory_limit_bytes{image!="", name!=""}
          ) > 0.9
          and
          container_spec_memory_limit_bytes{image!="", name!=""} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria alto en {{ $labels.name }}"
          description: "El contenedor supera el 90% de su límite de memoria."
