# Stack local sin autenticación: no expongas Loki directamente fuera de la máquina.
auth_enabled: false

# Endpoint HTTP interno de Loki, consumido por Alloy y Grafana.
server:
  http_listen_port: 3100

# Almacenamiento de un solo proceso con filesystem y anillo en memoria.
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Esquema TSDB usado para índices nuevos; conserva compatibilidad con los datos existentes.
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retención local de logs: 14 días.
limits_config:
  retention_period: 336h

# Compacta índices y aplica la política de retención configurada arriba.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
